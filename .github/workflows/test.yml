# La Chatte à Dédé - CI/CD Pipeline
# Generated by BMAD TEA (Test Architect) workflow
#
# Features:
# - Dependency caching (npm + Playwright browsers)
# - Parallel test execution (4 shards)
# - Burn-in testing for flaky detection (PRs only)
# - Artifact collection on failure
# - Unit + E2E test coverage

name: Tests

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  # Weekly burn-in on schedule
  schedule:
    - cron: '0 3 * * 0' # Sunday 3am UTC

env:
  NODE_VERSION: '24'
  CI: true

jobs:
  # ============================================
  # Stage 1: Lint & Type Check
  # ============================================
  lint:
    name: Lint & Type Check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --prefer-offline --no-audit

      - name: Run ESLint
        run: npm run lint

      - name: Type check
        run: npx tsc --noEmit

  # ============================================
  # Stage 2: Unit Tests
  # ============================================
  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --prefer-offline --no-audit

      - name: Run unit tests with coverage
        run: npm run test:unit:coverage

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage/
          retention-days: 7

  # ============================================
  # Stage 3: E2E Tests (Parallel Shards)
  # ============================================
  e2e-tests:
    name: E2E Tests (Shard ${{ matrix.shard }}/4)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: [lint, unit-tests]
    strategy:
      fail-fast: false # Run all shards even if one fails
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('**/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-playwright-

      - name: Install dependencies
        run: npm ci --prefer-offline --no-audit

      - name: Install Playwright browsers
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium firefox webkit

      - name: Install Playwright system deps
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: npx playwright install-deps

      - name: Run E2E tests (shard ${{ matrix.shard }}/4)
        run: npm run test:e2e -- --shard=${{ matrix.shard }}/4

      - name: Upload test artifacts on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-results-shard-${{ matrix.shard }}
          path: |
            test-results/
            playwright-report/
          retention-days: 30

      - name: Upload JUnit report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: junit-shard-${{ matrix.shard }}
          path: test-results/junit.xml
          retention-days: 30
          if-no-files-found: ignore

  # ============================================
  # Stage 4: Burn-In (PRs only)
  # ============================================
  burn-in:
    name: Burn-In (Flaky Detection)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    needs: [e2e-tests]
    if: github.event_name == 'pull_request' || github.event_name == 'schedule'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Full history for diff

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('**/package-lock.json') }}

      - name: Install dependencies
        run: npm ci --prefer-offline --no-audit

      - name: Install Playwright system deps
        run: npx playwright install-deps

      - name: Detect changed test files
        id: changed-tests
        run: |
          if [ "${{ github.event_name }}" == "schedule" ]; then
            echo "Scheduled run: testing all specs"
            echo "specs=" >> $GITHUB_OUTPUT
          else
            CHANGED=$(git diff --name-only origin/${{ github.base_ref }}...HEAD | grep -E '\.(spec|test)\.(ts|tsx)$' || echo "")
            echo "Changed specs: $CHANGED"
            echo "specs=$CHANGED" >> $GITHUB_OUTPUT
          fi

      - name: Run burn-in loop (10 iterations)
        run: |
          SPECS="${{ steps.changed-tests.outputs.specs }}"
          ITERATIONS=10

          echo "=========================================="
          echo "BURN-IN: $ITERATIONS iterations"
          if [ -n "$SPECS" ]; then
            echo "Specs: $SPECS"
          else
            echo "Running full suite (scheduled or no changed specs)"
          fi
          echo "=========================================="

          for i in $(seq 1 $ITERATIONS); do
            echo ""
            echo "--- Iteration $i/$ITERATIONS ---"
            if [ -n "$SPECS" ]; then
              npm run test:e2e -- $SPECS || {
                echo "BURN-IN FAILED on iteration $i"
                exit 1
              }
            else
              npm run test:e2e || {
                echo "BURN-IN FAILED on iteration $i"
                exit 1
              }
            fi
            echo "Iteration $i passed"
          done

          echo ""
          echo "=========================================="
          echo "BURN-IN PASSED: $ITERATIONS/$ITERATIONS successful"
          echo "=========================================="

      - name: Upload burn-in artifacts on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: burn-in-failure
          path: |
            test-results/
            playwright-report/
          retention-days: 7

  # ============================================
  # Stage 5: Merge Reports
  # ============================================
  merge-reports:
    name: Merge Test Reports
    runs-on: ubuntu-latest
    needs: [e2e-tests]
    if: always() && needs.e2e-tests.result != 'skipped'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --prefer-offline --no-audit

      - name: Download all shard results
        uses: actions/download-artifact@v4
        with:
          pattern: e2e-results-shard-*
          path: all-results/
          merge-multiple: true

      - name: Merge HTML reports
        if: hashFiles('all-results/**/*.html') != ''
        run: |
          npx playwright merge-reports --reporter=html all-results/ || echo "No reports to merge"

      - name: Upload merged report
        if: hashFiles('playwright-report/**') != ''
        uses: actions/upload-artifact@v4
        with:
          name: merged-playwright-report
          path: playwright-report/
          retention-days: 30

  # ============================================
  # Stage 6: Deploy (main branch only)
  # ============================================
  deploy:
    name: Deploy to VPS
    runs-on: ubuntu-latest
    needs: [e2e-tests]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    timeout-minutes: 15
    env:
      DEPLOY_PATH: /home/debian/lachatadede

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --prefer-offline --no-audit

      - name: Build frontend
        run: npm run build

      - name: Clone or update repository on VPS
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script_stop: true
          script: |
            set -e

            if [ ! -d "/home/debian/lachatadede/.git" ]; then
              echo "=== Cloning repository ==="
              rm -rf /home/debian/lachatadede
              git clone git@github.com:drayanqi/la-chatte-a-dede-2.git /home/debian/lachatadede
            fi

            cd /home/debian/lachatadede
            echo "=== Pulling latest code ==="
            git fetch origin main
            git reset --hard origin/main

      - name: Copy frontend build to VPS
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          source: "dist/*"
          target: "/home/debian/lachatadede/lachatadede-api/public/build"
          strip_components: 1

      - name: Deploy to VPS
        uses: appleboy/ssh-action@v1.0.3
        env:
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          DB_ROOT_PASSWORD: ${{ secrets.DB_ROOT_PASSWORD }}
          APP_KEY: ${{ secrets.APP_KEY }}
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          envs: DB_PASSWORD,DB_ROOT_PASSWORD,APP_KEY,DOCKERHUB_USERNAME,DOCKERHUB_TOKEN
          script_stop: true
          script: |
            set -e

            cd /home/debian/lachatadede

            echo "=== Logging in to Docker Hub ==="
            echo "${DOCKERHUB_TOKEN}" | docker login -u "${DOCKERHUB_USERNAME}" --password-stdin

            echo "=== Setting up environment ==="
            if [ ! -f deploy/.env ]; then
              cp deploy/.env.example deploy/.env
              echo "Created .env from template"
            fi

            # Update secrets securely via environment variables (not command line)
            cat > deploy/.env.secrets << EOF
            DB_PASSWORD=${DB_PASSWORD}
            MYSQL_ROOT_PASSWORD=${DB_ROOT_PASSWORD}
            APP_KEY=${APP_KEY}
            EOF

            # Merge secrets into .env
            while IFS='=' read -r key value; do
              if [ -n "$key" ]; then
                sed -i "s|^${key}=.*|${key}=${value}|" deploy/.env
              fi
            done < deploy/.env.secrets
            rm deploy/.env.secrets

            echo "=== Building Docker images ==="
            cd deploy
            docker compose build laravel

            echo "=== Starting services ==="
            docker compose up -d mysql

            # Wait for MySQL to be healthy
            echo "=== Waiting for MySQL to be ready ==="
            timeout 60 bash -c 'until docker compose exec -T mysql mysqladmin ping -h localhost --silent; do sleep 2; done' || {
              echo "MySQL failed to start"
              docker compose logs mysql
              exit 1
            }

            docker compose up -d nginx laravel

            echo "=== Running Laravel migrations ==="
            for i in 1 2 3; do
              if docker compose exec -T laravel php artisan migrate --force; then
                echo "Migrations completed successfully"
                break
              fi
              if [ $i -eq 3 ]; then
                echo "Migrations failed after 3 attempts"
                exit 1
              fi
              echo "Migration attempt $i failed, retrying in 5s..."
              sleep 5
            done

            echo "=== Clearing Laravel cache ==="
            docker compose exec -T laravel php artisan config:cache
            docker compose exec -T laravel php artisan route:cache
            docker compose exec -T laravel php artisan view:cache

            echo "=== Running health check ==="
            sleep 5
            curl -f -s --max-time 10 http://localhost/health || {
              echo "Health check failed!"
              docker compose logs
              exit 1
            }

            echo "=== Deployment complete ==="
            docker compose ps
