# La Chatte à Dédé - CI/CD Pipeline
# Generated by BMAD TEA (Test Architect) workflow
#
# Features:
# - Dependency caching (npm + Playwright browsers)
# - Parallel test execution (4 shards)
# - Burn-in testing for flaky detection (PRs only)
# - Artifact collection on failure
# - Unit + E2E test coverage

name: Tests

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  # Weekly burn-in on schedule
  schedule:
    - cron: '0 3 * * 0' # Sunday 3am UTC

env:
  NODE_VERSION: '24'
  CI: true

jobs:
  # ============================================
  # Stage 1: Lint & Type Check
  # ============================================
  lint:
    name: Lint & Type Check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --prefer-offline --no-audit

      - name: Run ESLint
        run: npm run lint

      - name: Type check
        run: npx tsc --noEmit

  # ============================================
  # Stage 2: Unit Tests
  # ============================================
  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --prefer-offline --no-audit

      - name: Run unit tests with coverage
        run: npm run test:unit:coverage

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage/
          retention-days: 7

  # ============================================
  # Stage 2b: Backend Tests (Laravel)
  # ============================================
  backend-tests:
    name: Backend Tests (Laravel)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          coverage: none

      - name: Get composer cache directory
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> $GITHUB_OUTPUT

      - name: Cache composer dependencies
        uses: actions/cache@v4
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: ${{ runner.os }}-composer-${{ hashFiles('**/composer.lock') }}
          restore-keys: |
            ${{ runner.os }}-composer-

      - name: Install dependencies
        working-directory: lachatadede-api
        run: composer install --prefer-dist --no-interaction --no-progress

      - name: Run backend tests
        working-directory: lachatadede-api
        run: php artisan test

  # ============================================
  # Stage 3: E2E Tests (Parallel Shards)
  # ============================================
  e2e-tests:
    name: E2E Tests (Shard ${{ matrix.shard }}/4)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: [lint, unit-tests, backend-tests]
    strategy:
      fail-fast: false # Run all shards even if one fails
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Setup PHP (E2E boots the Laravel backend)
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          coverage: none

      - name: Install backend dependencies
        working-directory: lachatadede-api
        run: composer install --prefer-dist --no-interaction --no-progress

      - name: Install engine dependencies
        working-directory: lachatadede-engine
        run: npm ci --prefer-offline --no-audit

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('**/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-playwright-

      - name: Install dependencies
        run: npm ci --prefer-offline --no-audit

      - name: Install Playwright browsers
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium firefox webkit

      - name: Install Playwright system deps
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: npx playwright install-deps

      - name: Run E2E tests (shard ${{ matrix.shard }}/4)
        run: npm run test:e2e -- --shard=${{ matrix.shard }}/4

      - name: Upload test artifacts on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-results-shard-${{ matrix.shard }}
          path: |
            test-results/
            playwright-report/
          retention-days: 30

      - name: Upload JUnit report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: junit-shard-${{ matrix.shard }}
          path: test-results/junit.xml
          retention-days: 30
          if-no-files-found: ignore

  # ============================================
  # Stage 4: Burn-In (PRs only)
  # ============================================
  burn-in:
    name: Burn-In (Flaky Detection)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    needs: [e2e-tests]
    if: github.event_name == 'pull_request' || github.event_name == 'schedule'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Full history for diff

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Setup PHP (E2E boots the Laravel backend)
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          coverage: none

      - name: Install backend dependencies
        working-directory: lachatadede-api
        run: composer install --prefer-dist --no-interaction --no-progress

      - name: Install engine dependencies
        working-directory: lachatadede-engine
        run: npm ci --prefer-offline --no-audit

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('**/package-lock.json') }}

      - name: Install dependencies
        run: npm ci --prefer-offline --no-audit

      - name: Install Playwright system deps
        run: npx playwright install-deps

      - name: Detect changed test files
        id: changed-tests
        run: |
          if [ "${{ github.event_name }}" == "schedule" ]; then
            echo "Scheduled run: testing all specs"
            echo "specs=" >> $GITHUB_OUTPUT
          else
            CHANGED=$(git diff --name-only origin/${{ github.base_ref }}...HEAD | grep -E '\.(spec|test)\.(ts|tsx)$' || echo "")
            echo "Changed specs: $CHANGED"
            echo "specs=$CHANGED" >> $GITHUB_OUTPUT
          fi

      - name: Run burn-in loop (10 iterations)
        run: |
          SPECS="${{ steps.changed-tests.outputs.specs }}"
          ITERATIONS=10

          echo "=========================================="
          echo "BURN-IN: $ITERATIONS iterations"
          if [ -n "$SPECS" ]; then
            echo "Specs: $SPECS"
          else
            echo "Running full suite (scheduled or no changed specs)"
          fi
          echo "=========================================="

          for i in $(seq 1 $ITERATIONS); do
            echo ""
            echo "--- Iteration $i/$ITERATIONS ---"
            if [ -n "$SPECS" ]; then
              npm run test:e2e -- $SPECS || {
                echo "BURN-IN FAILED on iteration $i"
                exit 1
              }
            else
              npm run test:e2e || {
                echo "BURN-IN FAILED on iteration $i"
                exit 1
              }
            fi
            echo "Iteration $i passed"
          done

          echo ""
          echo "=========================================="
          echo "BURN-IN PASSED: $ITERATIONS/$ITERATIONS successful"
          echo "=========================================="

      - name: Upload burn-in artifacts on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: burn-in-failure
          path: |
            test-results/
            playwright-report/
          retention-days: 7

  # ============================================
  # Stage 5: Merge Reports
  # ============================================
  merge-reports:
    name: Merge Test Reports
    runs-on: ubuntu-latest
    needs: [e2e-tests]
    if: always() && needs.e2e-tests.result != 'skipped'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --prefer-offline --no-audit

      - name: Download all shard results
        uses: actions/download-artifact@v4
        with:
          pattern: e2e-results-shard-*
          path: all-results/
          merge-multiple: true

      - name: Merge HTML reports
        if: hashFiles('all-results/**/*.html') != ''
        run: |
          npx playwright merge-reports --reporter=html all-results/ || echo "No reports to merge"

      - name: Upload merged report
        if: hashFiles('playwright-report/**') != ''
        uses: actions/upload-artifact@v4
        with:
          name: merged-playwright-report
          path: playwright-report/
          retention-days: 30

  # ============================================
  # Stage 6: Build images → GHCR → deploy to VPS (main branch only)
  # ============================================
  deploy:
    name: Build & Deploy to VPS
    runs-on: ubuntu-latest
    needs: [e2e-tests]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push api image
        uses: docker/build-push-action@v6
        with:
          context: lachatadede-api
          file: deploy/docker/Dockerfile.api
          target: production
          push: true
          tags: |
            ghcr.io/drayanqi/la-chatte-a-dede-2/api:latest
            ghcr.io/drayanqi/la-chatte-a-dede-2/api:sha-${{ github.sha }}

      - name: Build and push web image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/docker/Dockerfile.web
          push: true
          tags: |
            ghcr.io/drayanqi/la-chatte-a-dede-2/web:latest
            ghcr.io/drayanqi/la-chatte-a-dede-2/web:sha-${{ github.sha }}

      - name: Build and push engine image
        uses: docker/build-push-action@v6
        with:
          context: lachatadede-engine
          file: deploy/docker/Dockerfile.node
          target: production
          push: true
          tags: |
            ghcr.io/drayanqi/la-chatte-a-dede-2/engine:latest
            ghcr.io/drayanqi/la-chatte-a-dede-2/engine:sha-${{ github.sha }}

      - name: Ship compose file and env template to VPS
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          source: "deploy/docker-compose.yml,deploy/.env.example"
          target: "/home/debian/lachatadede/deploy/"
          strip_components: 1

      - name: Deploy to VPS
        uses: appleboy/ssh-action@v1.0.3
        env:
          GHCR_PAT: ${{ secrets.GHCR_PAT }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          DB_ROOT_PASSWORD: ${{ secrets.DB_ROOT_PASSWORD }}
          APP_KEY: ${{ secrets.APP_KEY }}
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          envs: GHCR_PAT,DB_PASSWORD,DB_ROOT_PASSWORD,APP_KEY
          script_stop: true
          script: |
            set -e

            cd /home/debian/lachatadede/deploy

            echo "=== Logging in to ghcr.io ==="
            # Disable credential helper to avoid GPG issues
            mkdir -p ~/.docker
            echo '{"credsStore":"","credHelpers":{}}' > ~/.docker/config.json
            export DOCKER_CONFIG=~/.docker
            echo "${GHCR_PAT}" | docker login ghcr.io -u drayanqi --password-stdin

            echo "=== Setting up environment ==="
            if [ ! -f .env ]; then
              cp .env.example .env
              echo "Created .env from template"
            fi

            # Update secrets securely via environment variables (not command line)
            cat > .env.secrets << EOF
            DB_PASSWORD=${DB_PASSWORD}
            MYSQL_ROOT_PASSWORD=${DB_ROOT_PASSWORD}
            APP_KEY=${APP_KEY}
            EOF

            # Merge secrets into .env
            while IFS='=' read -r key value; do
              if [ -n "$key" ]; then
                sed -i "s|^${key}=.*|${key}=${value}|" .env
              fi
            done < .env.secrets
            rm .env.secrets

            echo "=== Pulling images from GHCR ==="
            docker compose pull

            echo "=== Starting all four services ==="
            docker compose up -d

            # Wait for MySQL to be healthy
            echo "=== Waiting for MySQL to be ready ==="
            timeout 60 bash -c 'until docker compose exec -T mysql mysqladmin ping -h localhost --silent; do sleep 2; done' || {
              echo "MySQL failed to start"
              docker compose logs mysql
              exit 1
            }

            echo "=== Pre-migrate database dump ==="
            # Story 6.5 lifts this verbatim into deploy/backup.sh (with retention)
            mkdir -p /home/debian/lachatadede/backups
            docker compose exec -T mysql sh -c 'exec mysqldump --all-databases -uroot -p"$MYSQL_ROOT_PASSWORD"' | gzip > "/home/debian/lachatadede/backups/pre-migrate-$(date +%Y%m%d-%H%M%S).sql.gz"

            echo "=== Running Laravel migrations ==="
            for i in 1 2 3; do
              if docker compose exec -T laravel php artisan migrate --force; then
                echo "Migrations completed successfully"
                break
              fi
              if [ $i -eq 3 ]; then
                echo "Migrations failed after 3 attempts"
                exit 1
              fi
              echo "Migration attempt $i failed, retrying in 5s..."
              sleep 5
            done

            echo "=== Caching Laravel config/routes/views ==="
            docker compose exec -T laravel php artisan config:cache
            docker compose exec -T laravel php artisan route:cache
            docker compose exec -T laravel php artisan view:cache

            echo "=== Running health check ==="
            sleep 5
            curl -f -s --max-time 10 http://localhost/health || {
              echo "Health check failed!"
              docker compose logs
              exit 1
            }

            echo "=== Deployment complete ==="
            docker compose ps
