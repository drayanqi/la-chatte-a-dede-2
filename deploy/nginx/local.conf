# Nginx configuration for local development
# Proxies frontend to Vite dev server, API to Laravel

upstream vite {
    server frontend:3000;
}

upstream laravel_upstream {
    server laravel:9000;
}

server {
    listen 80;
    server_name localhost;

    # API routes - all /api/* goes to Laravel
    location /api/ {
        fastcgi_pass laravel_upstream;
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME /var/www/html/public/index.php;
        fastcgi_param REQUEST_URI $request_uri;
        include fastcgi_params;

        # Longer timeouts for debugging
        fastcgi_read_timeout 300;
    }

    # Vite HMR WebSocket
    location /__vite_hmr {
        proxy_pass http://vite;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
    }

    # Vite assets (node_modules, src files with @fs prefix)
    location /@fs/ {
        proxy_pass http://vite;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location /@vite/ {
        proxy_pass http://vite;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }

    location /node_modules/ {
        proxy_pass http://vite;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }

    location /src/ {
        proxy_pass http://vite;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }

    # All other routes proxy to Vite dev server
    location / {
        proxy_pass http://vite;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Health check
    location /health {
        access_log off;
        return 200 "OK";
        add_header Content-Type text/plain;
    }
}
