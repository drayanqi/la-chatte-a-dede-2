# HTTP: ACME challenges stay here forever (renewals always validate over
# HTTP); everything else is redirected to HTTPS.
server {
    listen 80;
    server_name venanciohugo.fr lachatadede.venanciohugo.fr;

    # ACME HTTP-01 challenges (story 6.4): certbot on the host writes tokens to
    # /home/debian/lachatadede/certbot/www/.well-known/acme-challenge/<token>,
    # which lines up with this root via the compose bind mount. ^~ keeps the
    # regex locations (SPA fallback, hidden-file deny) out of the way.
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/html/certbot;
        default_type "text/plain";
        try_files $uri =404;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# HTTPS: SPA + API + health, terminated with the Let's Encrypt certificate.
server {
    listen 443 ssl;
    http2 on;
    server_name venanciohugo.fr lachatadede.venanciohugo.fr;

    # Certbot (host) renews these; the renewal deploy hook runs
    # `nginx -s reload` in this container so new certs are picked up live.
    ssl_certificate /etc/letsencrypt/live/venanciohugo.fr/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/venanciohugo.fr/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    # Frontend React SPA
    root /var/www/html/frontend;
    index index.html;

    # API routes - all /api/* goes to Laravel
    location /api/ {
        fastcgi_pass laravel:9000;
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME /var/www/html/public/index.php;
        fastcgi_param REQUEST_URI $request_uri;
        include fastcgi_params;
    }

    # SPA routing - serve index.html for all other routes
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Static assets with long cache
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Deny access to hidden files
    location ~ /\.(?!well-known) {
        deny all;
    }

    # Health check
    location /health {
        access_log off;
        return 200 "OK";
        add_header Content-Type text/plain;
    }
}
