# La Chatte à Dédé - Production Docker Compose
# Services: nginx (web image), laravel, node (game engine), mysql
#
# All three app images are built in CI (GitHub Actions → GHCR) and pulled
# here — the VPS never builds anything. All tags share IMAGE_TAG, so a
# rollback is one variable (see docs/DEPLOYMENT.md):
#   IMAGE_TAG=sha-<sha> docker compose pull && docker compose up -d

services:
  nginx:
    image: ghcr.io/drayanqi/la-chatte-a-dede-2/web:${IMAGE_TAG:-latest}
    ports:
      - "80:80"
    depends_on:
      laravel:
        condition: service_started
    networks:
      - lachatadede_net
    restart: unless-stopped

  laravel:
    image: ghcr.io/drayanqi/la-chatte-a-dede-2/api:${IMAGE_TAG:-latest}
    volumes:
      # Shared app storage on the host (created by ansible 6.2). BOTH container
      # uids need write access: the engine writes match frames to the literal
      # output_path Laravel sends (/var/www/html/storage/simulations) and
      # Laravel reads them back, while Laravel keeps its own logs/framework
      # dirs in the same tree. ansible chmods this one dir 777 — a tradeoff
      # accepted on this single-tenant box (only container uids touch it).
      - /home/debian/lachatadede/storage:/var/www/html/storage
      # bootstrap/cache must stay writable across deploys; the host has no
      # repo checkout anymore, so it is a named volume (seeded from the image
      # on first use, www-data-owned).
      - laravel_bootstrap:/var/www/html/bootstrap/cache
    environment:
      - APP_ENV=production
      - APP_DEBUG=false
      - APP_KEY=${APP_KEY}
      - APP_URL=${APP_URL:-http://venanciohugo.fr}
      - DB_CONNECTION=mysql
      - DB_HOST=mysql
      - DB_PORT=3306
      - DB_DATABASE=${DB_DATABASE:-lachatadede}
      - DB_USERNAME=${DB_USERNAME:-lachatadede_user}
      - DB_PASSWORD=${DB_PASSWORD}
      - GAME_ENGINE_URL=http://node:3001
      # Additional production settings
      - LOG_CHANNEL=stack
      - SESSION_DRIVER=database
      - CACHE_STORE=database
      - QUEUE_CONNECTION=database
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - lachatadede_net
    restart: unless-stopped

  node:
    image: ghcr.io/drayanqi/la-chatte-a-dede-2/engine:${IMAGE_TAG:-latest}
    volumes:
      # Mounted at the SAME container path as laravel — NOT /app/storage. The
      # engine writes frames to the literal output_path from the /simulate
      # payload, which is Laravel's /var/www/html/storage/simulations.
      - /home/debian/lachatadede/storage:/var/www/html/storage
    environment:
      - NODE_ENV=production
      - PORT=3001
    networks:
      - lachatadede_net
    restart: unless-stopped

  mysql:
    image: mysql:8.0
    # Sized for the 4 GB box: leave headroom for php-fpm and the engine
    # (isolated-vm spikes) — do not raise without re-checking engine memory
    command: --innodb-buffer-pool-size=512M --max-connections=100
    volumes:
      - mysql_data:/var/lib/mysql
    environment:
      - MYSQL_ROOT_PASSWORD=${MYSQL_ROOT_PASSWORD}
      - MYSQL_DATABASE=${DB_DATABASE:-lachatadede}
      - MYSQL_USER=${DB_USERNAME:-lachatadede_user}
      - MYSQL_PASSWORD=${DB_PASSWORD}
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${MYSQL_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - lachatadede_net
    restart: unless-stopped

networks:
  lachatadede_net:
    driver: bridge

volumes:
  mysql_data:
  laravel_bootstrap:
