# La Chatte à Dédé - Local Development Docker Compose
# Usage: docker compose -f docker-compose.yml -f docker-compose.local.yml up
# Or:    docker compose --profile local up

services:
  nginx:
    volumes:
      - ./nginx/local.conf:/etc/nginx/conf.d/default.conf:ro
      # No static file mounts needed - nginx proxies to Vite/Laravel in dev mode
    ports:
      - "8080:80"
    environment:
      - NGINX_ENVSUBST_OUTPUT_DIR=/etc/nginx/conf.d

  laravel:
    build:
      context: ../lachatadede-api
      dockerfile: ../deploy/docker/Dockerfile.api
      target: development
    volumes:
      # Mount entire API directory for live code changes
      - ../lachatadede-api:/var/www/html
      # Preserve vendor from container (don't overwrite with empty host dir)
      - laravel_vendor_dev:/var/www/html/vendor
    environment:
      - APP_ENV=local
      - APP_DEBUG=true
      - APP_KEY=${APP_KEY:-base64:xxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxx=}
      - APP_URL=http://localhost:8080
      - DB_CONNECTION=mysql
      - DB_HOST=mysql
      - DB_PORT=3306
      - DB_DATABASE=${DB_DATABASE:-lachatadede}
      - DB_USERNAME=${DB_USERNAME:-lachatadede_user}
      - DB_PASSWORD=${DB_PASSWORD:-localdevpassword}
      - GAME_ENGINE_URL=http://node:3001
      - LOG_CHANNEL=stack
      - LOG_LEVEL=debug
      - SESSION_DRIVER=database
      - CACHE_STORE=array
      - QUEUE_CONNECTION=sync

  node:
    build:
      context: .
      dockerfile: docker/Dockerfile.node
      target: development
    volumes:
      # Mount source for hot reload (when Epic 3 is implemented)
      - ../game-engine:/app
    environment:
      - NODE_ENV=development
      - PORT=3001
    ports:
      - "3001:3001"
    restart: "no"

  mysql:
    ports:
      # Expose MySQL for local tools (TablePlus, DBeaver, etc.)
      - "3306:3306"
    environment:
      - MYSQL_ROOT_PASSWORD=${MYSQL_ROOT_PASSWORD:-localrootpassword}
      - MYSQL_DATABASE=${DB_DATABASE:-lachatadede}
      - MYSQL_USER=${DB_USERNAME:-lachatadede_user}
      - MYSQL_PASSWORD=${DB_PASSWORD:-localdevpassword}

  # Frontend dev server (Vite)
  frontend:
    image: node:24-alpine
    working_dir: /app
    volumes:
      - ../:/app
      - frontend_node_modules:/app/node_modules
    ports:
      - "3000:3000"
    environment:
      - VITE_API_URL=http://localhost:8080/api
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0"
    networks:
      - lachatadede_net

  # Adminer for database management (optional but useful)
  adminer:
    image: adminer:latest
    ports:
      - "8081:8080"
    depends_on:
      - mysql
    networks:
      - lachatadede_net
    restart: unless-stopped

volumes:
  laravel_vendor_dev:
  frontend_node_modules:
